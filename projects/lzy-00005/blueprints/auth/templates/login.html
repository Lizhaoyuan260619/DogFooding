<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户登录 - Zettelkasten</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>📝 Zettelkasten</h1>
                <p>欢迎回来，继续你的知识之旅</p>
            </div>

            {% if error %}
            <div class="alert alert-error">{{ error }}</div>
            {% endif %}

            <form id="loginForm" class="auth-form" novalidate>
                <div class="form-group">
                    <label for="identifier">用户名或邮箱 <span class="required">*</span></label>
                    <input type="text" id="identifier" name="identifier"
                           placeholder="请输入用户名或邮箱"
                           autocomplete="username" required>
                    <div class="error-message" id="identifierError"></div>
                </div>

                <div class="form-group">
                    <label for="password">密码 <span class="required">*</span></label>
                    <input type="password" id="password" name="password"
                           placeholder="请输入密码"
                           autocomplete="current-password" required>
                    <div class="error-message" id="passwordError"></div>
                </div>

                <div class="form-group checkbox-group">
                    <input type="checkbox" id="remember_me" name="remember_me">
                    <label for="remember_me">记住我（7天）</label>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">
                    <span class="btn-text">登录</span>
                    <span class="btn-loading" style="display: none;">登录中...</span>
                </button>
            </form>

            <div class="auth-divider">
                <span>或使用第三方账号登录</span>
            </div>

            <div class="social-login">
                {% if github_auth_url %}
                <a href="/auth/github/login" class="btn btn-github">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57 0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41-1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815 2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925 0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23.96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65.24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925.435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57A12.02 12.02 0 0024 12c0-6.63-5.37-12-12-12z"/>
                    </svg>
                    使用 GitHub 登录
                </a>
                {% endif %}
            </div>

            <div class="auth-footer">
                <p>还没有账号？<a href="/auth/register">立即注册</a></p>
            </div>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/js/auth.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            Auth.initLogin();
        });
    </script>
</body>
</html>
