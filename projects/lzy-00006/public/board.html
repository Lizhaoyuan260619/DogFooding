<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协作画板 - 绘图</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/board.css">
</head>
<body class="board-page">
    <div class="board-container">
        <header class="header">
            <div class="header-left">
                <h1 class="logo">协作画板</h1>
                <div class="room-info">
                    <span class="room-label">房间号：</span>
                    <span id="roomCode" class="room-code">--</span>
                    <button id="copyRoomCode" class="btn-icon" title="复制邀请码">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <rect x="9" y="9" width="13" height="13" rx="2"/>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
                        </svg>
                    </button>
                </div>
            </div>
            <div class="header-right">
                <span id="userInfo" class="user-info">--</span>
                <button id="leaveRoomBtn" class="btn btn-secondary btn-small">离开房间</button>
            </div>
        </header>

        <div class="main-content">
            <aside class="sidebar left-sidebar">
                <div class="tool-section">
                    <h3 class="section-title">绘图工具</h3>
                    <div class="tool-buttons">
                        <button class="tool-btn active" data-tool="pen" title="画笔">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 19l7-7 3 3-7 7-3-3z"/>
                                <path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/>
                                <path d="M2 2l7.586 7.586"/>
                                <circle cx="11" cy="11" r="2"/>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="erase" title="橡皮擦">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M20 20H7L3 16.8a2 2 0 0 1 0-2.8L15.2 2a2 2 0 0 1 2.8 0L22 6a2 2 0 0 1 0 2.8L8 20"/>
                                <path d="M18 13l-8-8"/>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="line" title="直线">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <line x1="5" y1="19" x2="19" y2="5"/>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="rect" title="矩形">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <rect x="3" y="3" width="18" height="18" rx="2"/>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="circle" title="圆形">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <circle cx="12" cy="12" r="10"/>
                            </svg>
                        </button>
                        <button class="tool-btn" data-tool="text" title="文字">
                            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M4 7V4h16v3"/>
                                <path d="M9 20h6"/>
                                <path d="M12 4v16"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">颜色</h3>
                    <div class="color-picker-wrapper">
                        <input type="color" id="colorPicker" value="#000000">
                        <div class="color-presets">
                            <div class="color-preset" style="background: #000000" data-color="#000000"></div>
                            <div class="color-preset" style="background: #ef4444" data-color="#ef4444"></div>
                            <div class="color-preset" style="background: #f97316" data-color="#f97316"></div>
                            <div class="color-preset" style="background: #eab308" data-color="#eab308"></div>
                            <div class="color-preset" style="background: #22c55e" data-color="#22c55e"></div>
                            <div class="color-preset" style="background: #3b82f6" data-color="#3b82f6"></div>
                            <div class="color-preset" style="background: #8b5cf6" data-color="#8b5cf6"></div>
                            <div class="color-preset" style="background: #ffffff" data-color="#ffffff"></div>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">线条粗细</h3>
                    <div class="line-width-control">
                        <input type="range" id="lineWidthSlider" min="1" max="50" value="3">
                        <span id="lineWidthValue" class="line-width-value">3px</span>
                        <div class="line-preview">
                            <div id="linePreview" class="line-preview-bar"></div>
                        </div>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">字体大小</h3>
                    <div class="font-size-control">
                        <input type="range" id="fontSizeSlider" min="12" max="72" value="24">
                        <span id="fontSizeValue" class="font-size-value">24px</span>
                    </div>
                </div>

                <div class="tool-section">
                    <h3 class="section-title">填充</h3>
                    <label class="checkbox-label">
                        <input type="checkbox" id="fillCheckbox">
                        <span>启用填充</span>
                    </label>
                    <input type="color" id="fillColorPicker" value="#ffffff" class="fill-color-picker">
                </div>

                <div class="tool-section">
                    <h3 class="section-title">操作</h3>
                    <div class="action-buttons">
                        <button id="undoBtn" class="btn btn-action" title="撤销 (Ctrl+Z)" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M3 7v6h6"/>
                                <path d="M21 17a9 9 0 0 0-9-9 9 9 0 0 0-6 2.3L3 13"/>
                            </svg>
                            撤销
                        </button>
                        <button id="redoBtn" class="btn btn-action" title="重做 (Ctrl+Y)" disabled>
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 7v6h-6"/>
                                <path d="M3 17a9 9 0 0 1 9-9 9 9 0 0 1 6 2.3l3 2.7"/>
                            </svg>
                            重做
                        </button>
                        <button id="exportBtn" class="btn btn-action btn-export">
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                                <polyline points="7,10 12,15 17,10"/>
                                <line x1="12" y1="15" x2="12" y2="3"/>
                            </svg>
                            导出 PNG
                        </button>
                    </div>
                </div>
            </aside>

            <main class="canvas-container" id="canvasContainer">
                <div id="cursorLayer" class="cursor-layer"></div>
            </main>

            <aside class="sidebar right-sidebar">
                <div class="panel">
                    <h3 class="section-title">
                        图层
                        <button id="addLayerBtn" class="btn-icon" title="添加图层">
                            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M12 5v14M5 12h14"/>
                            </svg>
                        </button>
                    </h3>
                    <div id="layerList" class="layer-list"></div>
                </div>

                <div class="panel">
                    <h3 class="section-title">语音对讲</h3>
                    <div id="voicePanel" class="voice-panel">
                        <div class="voice-status">
                            <span id="voiceStatusDot" class="voice-status-dot voice-status-disconnected"></span>
                            <span id="voiceStatusText" class="voice-status-text">未连接</span>
                        </div>
                        <div class="voice-controls">
                            <button id="voiceJoinBtn" class="voice-btn voice-btn-join">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="12" y1="19" x2="12" y2="23"/>
                                    <line x1="8" y1="23" x2="16" y2="23"/>
                                </svg>
                                加入语音
                            </button>
                            <button id="voicePTTBtn" class="voice-btn voice-btn-ptt" style="display:none">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                </svg>
                                按住说话
                            </button>
                            <button id="voiceMuteBtn" class="voice-btn voice-btn-mute" style="display:none">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                                静音
                            </button>
                            <button id="voiceLeaveBtn" class="voice-btn voice-btn-leave" style="display:none">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                                    <line x1="23" y1="9" x2="17" y2="15"/>
                                    <line x1="17" y1="9" x2="23" y2="15"/>
                                </svg>
                            </button>
                        </div>
                        <div id="voiceAudioMeter" class="voice-audio-meter" style="display:none">
                            <div class="voice-meter-track">
                                <div id="voiceMeterFill" class="voice-meter-fill"></div>
                            </div>
                        </div>
                        <div id="voiceAdminControls" class="voice-controls" style="display:none">
                            <button id="voiceMuteAllBtn" class="voice-btn" style="flex:1">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
                                    <path d="M17 8v4a5 5 0 0 1-10 0V8"/>
                                    <line x1="1" y1="1" x2="23" y2="23"/>
                                </svg>
                                全体静音
                            </button>
                        </div>
                        <div id="voicePeerList" class="voice-peer-list" style="display:none"></div>
                    </div>
                </div>

                <div class="panel">
                    <h3 class="section-title">在线用户</h3>
                    <div id="userList" class="user-list"></div>
                </div>

                <div class="panel">
                    <h3 class="section-title">操作记录</h3>
                    <div id="historyList" class="history-list">
                        <div class="empty-history">暂无操作记录</div>
                    </div>
                </div>
            </aside>
        </div>
    </div>

    <div id="toastContainer" class="toast-container"></div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/layer-manager.js"></script>
    <script src="/js/commands.js"></script>
    <script src="/js/canvas-renderer.js"></script>
    <script src="/js/socket-client.js"></script>
    <script src="/js/voice-manager.js"></script>
    <script src="/js/app.js"></script>
</body>
</html>
