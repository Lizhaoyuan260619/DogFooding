<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>协作画板 - 多人实时在线绘图</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="home-page">
    <div class="home-container">
        <div class="hero-section">
            <h1 class="hero-title">协作画板</h1>
            <p class="hero-subtitle">多人实时在线绘图，创意无限，协作无间</p>
        </div>
        
        <div class="card">
            <div class="form-group">
                <label for="userName">你的昵称</label>
                <input type="text" id="userName" placeholder="请输入昵称" maxlength="20">
            </div>
            
            <div class="divider">
                <span>或</span>
            </div>
            
            <div class="button-group">
                <button id="createRoomBtn" class="btn btn-primary">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M12 5v14M5 12h14"/>
                    </svg>
                    创建新房间
                </button>
                
                <div class="join-group">
                    <input type="text" id="roomCode" placeholder="输入邀请码" maxlength="6">
                    <button id="joinRoomBtn" class="btn btn-secondary">加入房间</button>
                </div>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
        </div>
        
        <div class="features">
            <div class="feature-item">
                <div class="feature-icon">🎨</div>
                <h3>丰富工具</h3>
                <p>画笔、橡皮擦、直线、矩形、圆形、文字</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">📚</div>
                <h3>图层系统</h3>
                <p>支持最多5个图层，独立管理，灵活创作</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">↩️</div>
                <h3>撤销重做</h3>
                <p>命令模式实现，精准记录每一步操作</p>
            </div>
            <div class="feature-item">
                <div class="feature-icon">👥</div>
                <h3>实时协作</h3>
                <p>多人同时在线，实时同步，光标追踪</p>
            </div>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script src="/js/index.js"></script>
</body>
</html>
